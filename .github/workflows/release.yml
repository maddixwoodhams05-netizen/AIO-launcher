# Builds the installer and portable zip on a Windows machine and attaches them
# to a GitHub Release named after the version in package.json (e.g. v1.1.0).
# Before releasing, bump the version and add what changed to CHANGELOG.md.
# Start it from the Actions tab ("Run workflow"), or by pushing a version tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Test build: a draft release only you can see. The launcher will not update to it.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the automatic tests
        run: npm test

      - name: Build installer and portable zip
        run: npx electron-builder --win --publish never

      # The release text: what's new (from CHANGELOG.md) and what each download is.
      - name: Write the release notes
        run: node .github/release-notes.js > dist/release-notes.md

      - name: Read the version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Running this again replaces the old release, so the tag and source
      # code always match the newest build.
      - name: Remove an older release with the same version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.version.outputs.tag }}" --cleanup-tag --yes || true

      - name: Attach them to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Maio Launcher ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # latest.yml and the .blockmap let the installed launcher update itself.
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/*.blockmap
          body_path: dist/release-notes.md
          draft: ${{ inputs.draft == true }}
